<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schaatssprint — Boarding admin</title>
<style>
  :root {
    --bg: #0b1016;
    --line: rgba(255,255,255,.12);
    --text: #eef5ff;
    --muted: rgba(238,245,255,.55);
    --accent: #4fd0ff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(120% 80% at 50% 0%, #152033, var(--bg));
    color: var(--text); padding: 24px 16px 48px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: clamp(22px, 4vw, 32px); margin: 0 0 6px; letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 22px; line-height: 1.45; font-size: 14px; }
  .hint {
    background: rgba(79,208,255,.08); border: 1px solid rgba(79,208,255,.25);
    border-radius: 12px; padding: 12px 14px; margin: -8px 0 18px; font-size: 13px; line-height: 1.45;
    color: #cfe8ff;
  }
  .hint b { color: #fff; }
  .card {
    background: rgba(18,26,36,.92);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 11px; letter-spacing: .12em; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  input[type=text], input[type=password], input[type=color] {
    width: 100%; border-radius: 10px; border: 2px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.06); color: #fff; padding: .65em .8em; font-size: 16px; font-weight: 700;
  }
  input[type=color] { padding: 4px; height: 44px; cursor: pointer; }
  input[type=file] { display: none; }
  .row { display: grid; gap: 10px; grid-template-columns: 1.3fr .55fr .55fr auto auto; align-items: end; }
  .img-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  @media (max-width: 720px) {
    .row { grid-template-columns: 1fr 1fr; }
    .row .full { grid-column: 1 / -1; }
  }
  .btn {
    border: 0; border-radius: 999px; padding: .7em 1.3em; font-weight: 800; cursor: pointer;
    background: linear-gradient(180deg, #4fd0ff, #1b8ed0); color: #04202f;
  }
  .btn.ghost { background: transparent; color: #cfe8ff; border: 2px solid rgba(255,255,255,.28); }
  .btn.warm { background: linear-gradient(180deg, #ffd85e, #f2a51b); color: #3a2400; }
  .btn.danger { background: transparent; color: var(--danger); border: 2px solid rgba(255,107,107,.45); }
  .btn:disabled { opacity: .4; cursor: default; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .preview {
    height: 64px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-weight: 900; letter-spacing: .04em; border: 1px solid rgba(0,0,0,.35);
    margin-top: 8px; text-shadow: 0 1px 0 rgba(0,0,0,.25);
    background-size: cover; background-position: center; overflow: hidden;
  }
  .preview.has-img { text-shadow: none; color: transparent !important; }
  .item { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
  .msg { margin-top: 12px; font-weight: 700; min-height: 1.2em; }
  .msg.ok { color: #8ff2a0; }
  .msg.err { color: #ff9a8a; }
  .login-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .login-row > div { flex: 1; min-width: 180px; }
  .hidden { display: none !important; }
  .strip {
    display: flex; gap: 0; overflow: hidden; border-radius: 10px; border: 1px solid var(--line); height: 52px;
  }
  .strip span {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 12px; white-space: nowrap; overflow: hidden; padding: 0 6px;
    background-size: cover; background-position: center;
  }
  .img-name { font-size: 12px; color: var(--muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>BOARDING <span>ADS</span></h1>
  <p class="sub">Beheer sponsorsteksten en -beelden op de boarding. Wijzigingen staan meteen live voor nieuwe race-loads.</p>
  <div class="hint">
    <b>Afbeeldingen:</b> PNG, JPG of WebP · max 3&nbsp;MB<br>
    Ideaal formaat: <b>1360×224</b> of <b>680×112</b> px (breed × laag, ~6:1). Wordt bijgesneden/gevuld op het bord.
  </div>

  <div class="card" id="loginCard">
    <div class="login-row">
      <div>
        <label>ADMIN WACHTWOORD</label>
        <input type="password" id="pw" placeholder="Wachtwoord" autocomplete="current-password">
      </div>
      <button class="btn" id="loginBtn">Inloggen</button>
    </div>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div class="card hidden" id="editorCard">
    <div id="list"></div>
    <div class="actions">
      <button class="btn ghost" id="addBtn">+ Ad toevoegen</button>
      <button class="btn warm" id="saveBtn">Opslaan</button>
      <button class="btn ghost" id="logoutBtn">Uitloggen</button>
    </div>
    <div class="msg" id="saveMsg"></div>
    <p class="sub" style="margin:16px 0 8px">Live preview boarding</p>
    <div class="strip" id="strip"></div>
  </div>
</div>
<script>
(() => {
  const KEY = 'schaats:admin-pw';
  let ads = [];
  let password = localStorage.getItem(KEY) || '';

  const $ = id => document.getElementById(id);
  const loginCard = $('loginCard'), editorCard = $('editorCard');
  const listEl = $('list'), strip = $('strip');
  const loginMsg = $('loginMsg'), saveMsg = $('saveMsg');

  function setMsg(el, text, ok) {
    el.textContent = text || '';
    el.className = 'msg ' + (ok ? 'ok' : (text ? 'err' : ''));
  }

  function showEditor(on) {
    loginCard.classList.toggle('hidden', on);
    editorCard.classList.toggle('hidden', !on);
  }

  function renderStrip() {
    strip.innerHTML = '';
    ads.forEach(a => {
      const s = document.createElement('span');
      if (a.img) {
        s.style.backgroundImage = 'url(' + a.img + ')';
        s.textContent = '';
      } else {
        s.textContent = a.t || '…';
        s.style.background = a.bg || '#101820';
        s.style.color = a.fg || '#fff';
      }
      strip.appendChild(s);
    });
  }

  function readForm() {
    return [...listEl.querySelectorAll('.item')].map(item => {
      const t = item.querySelector('[data-f=t]').value.trim();
      const bg = item.querySelector('[data-f=bg]').value;
      const fg = item.querySelector('[data-f=fg]').value;
      const img = item.dataset.img || '';
      if (!t && !img) return null;
      return { t: t || 'SPONSOR', bg, fg, ...(img ? { img } : {}) };
    }).filter(Boolean);
  }

  function paintPreview(item) {
    const t = item.querySelector('[data-f=t]').value || 'TEKST';
    const bg = item.querySelector('[data-f=bg]').value;
    const fg = item.querySelector('[data-f=fg]').value;
    const img = item.dataset.img || '';
    const prev = item.querySelector('.preview');
    const nameEl = item.querySelector('.img-name');
    if (img) {
      prev.classList.add('has-img');
      prev.style.backgroundImage = 'url(' + img + ')';
      prev.style.backgroundColor = bg;
      prev.textContent = '';
      nameEl.textContent = img.split('/').pop();
    } else {
      prev.classList.remove('has-img');
      prev.style.backgroundImage = '';
      prev.style.background = bg;
      prev.style.color = fg;
      prev.textContent = t;
      nameEl.textContent = 'geen afbeelding — tekstbord';
    }
    ads = readForm();
    renderStrip();
  }

  async function uploadFile(file, item) {
    if (!file) return;
    if (!/^image\/(png|jpeg|jpg|webp|gif)$/i.test(file.type)) {
      setMsg(saveMsg, 'Alleen PNG, JPG, WebP of GIF.', false);
      return;
    }
    if (file.size > 3.5 * 1024 * 1024) {
      setMsg(saveMsg, 'Max 3 MB per afbeelding.', false);
      return;
    }
    setMsg(saveMsg, 'Uploaden…', true);
    const data = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
    const res = await fetch('/api/ads/upload', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Admin-Password': password
      },
      body: JSON.stringify({ data })
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(d.error || 'Upload mislukt');
    item.dataset.img = d.img;
    paintPreview(item);
    setMsg(saveMsg, 'Afbeelding geüpload — vergeet niet op te slaan.', true);
  }

  function addRow(ad = { t: '', bg: '#1b8ed0', fg: '#ffffff', img: '' }, focus) {
    const item = document.createElement('div');
    item.className = 'item';
    if (ad.img) item.dataset.img = ad.img;
    item.innerHTML = `
      <div class="row">
        <div class="full">
          <label>TEKST (fallback / zonder beeld)</label>
          <input type="text" data-f="t" maxlength="32" value="">
        </div>
        <div>
          <label>ACHTERGROND</label>
          <input type="color" data-f="bg" value="#1b8ed0">
        </div>
        <div>
          <label>TEKSTKLEUR</label>
          <input type="color" data-f="fg" value="#ffffff">
        </div>
        <button type="button" class="btn ghost up" title="Omhoog">↑</button>
        <button type="button" class="btn danger del">Verwijder</button>
      </div>
      <div class="img-row">
        <button type="button" class="btn ghost pick">Afbeelding kiezen</button>
        <button type="button" class="btn ghost clear-img">Beeld weg</button>
        <span class="img-name"></span>
        <input type="file" accept="image/png,image/jpeg,image/webp,image/gif">
      </div>
      <div class="preview"></div>`;
    item.querySelector('[data-f=t]').value = ad.t || '';
    item.querySelector('[data-f=bg]').value = ad.bg || '#1b8ed0';
    item.querySelector('[data-f=fg]').value = ad.fg || '#ffffff';
    const fileInp = item.querySelector('input[type=file]');
    item.querySelectorAll('[data-f]').forEach(inp => inp.addEventListener('input', () => paintPreview(item)));
    item.querySelector('.pick').addEventListener('click', () => fileInp.click());
    item.querySelector('.clear-img').addEventListener('click', () => {
      delete item.dataset.img;
      fileInp.value = '';
      paintPreview(item);
    });
    fileInp.addEventListener('change', () => {
      uploadFile(fileInp.files[0], item).catch(e => setMsg(saveMsg, e.message || 'Upload mislukt', false));
    });
    item.querySelector('.del').addEventListener('click', () => {
      item.remove();
      ads = readForm();
      renderStrip();
    });
    item.querySelector('.up').addEventListener('click', () => {
      const prev = item.previousElementSibling;
      if (prev) listEl.insertBefore(item, prev);
      ads = readForm();
      renderStrip();
    });
    listEl.appendChild(item);
    paintPreview(item);
    if (focus) item.querySelector('[data-f=t]').focus();
  }

  function renderList() {
    listEl.innerHTML = '';
    ads.forEach(a => addRow(a, false));
    renderStrip();
  }

  async function loadAds() {
    const r = await fetch('/api/ads');
    const d = await r.json();
    ads = Array.isArray(d.ads) ? d.ads : [];
    renderList();
  }

  async function tryLogin(pw) {
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Login mislukt');
    password = pw;
    localStorage.setItem(KEY, pw);
    showEditor(true);
    await loadAds();
  }

  $('loginBtn').addEventListener('click', async () => {
    setMsg(loginMsg, '');
    try { await tryLogin($('pw').value); }
    catch (e) { setMsg(loginMsg, e.message || 'Fout', false); }
  });
  $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

  $('addBtn').addEventListener('click', () => addRow({ t: 'NIEUWE SPONSOR', bg: '#1b8ed0', fg: '#ffffff' }, true));
  $('logoutBtn').addEventListener('click', () => {
    password = '';
    localStorage.removeItem(KEY);
    showEditor(false);
    $('pw').value = '';
  });

  $('saveBtn').addEventListener('click', async () => {
    setMsg(saveMsg, '');
    const next = readForm();
    if (!next.length) return setMsg(saveMsg, 'Minimaal 1 ad met tekst of afbeelding.', false);
    try {
      const r = await fetch('/api/ads', {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Password': password
        },
        body: JSON.stringify({ ads: next })
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'Opslaan mislukt');
      ads = d.ads || next;
      renderList();
      setMsg(saveMsg, 'Opgeslagen — boarding is bijgewerkt.', true);
    } catch (e) {
      setMsg(saveMsg, e.message || 'Fout', false);
    }
  });

  if (password) {
    tryLogin(password).catch(() => {
      localStorage.removeItem(KEY);
      password = '';
      showEditor(false);
    });
  }
})();
</script>
</body>
</html>
